[build]
  publish = "public"
  command = "yarn run build"
[build.environment]
  NODE_VERSION = "24"
  YARN_VERSION = "1.22.19"

[[plugins]]
  package = "@netlify/plugin-lighthouse"

  [plugins.inputs.thresholds]
    performance = 0.9
    accessibility = 0.9
    best-practices = 0.9
    seo = 0.9

  [[plugins.inputs.audits]]
    path = "/"